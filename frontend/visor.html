<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BIOCINÉTICA · Visor 3D</title>
    <link rel="stylesheet" href="/visor.css?v=seleccion">
</head>
<body>
    <header class="visor-cabecera">
        <div class="marca">
            <img class="logo" src="/logo.png" alt="">
            <div>
                <p class="visor-kicker">Biocinética</p>
                <h1>Visor 3D</h1>
                <p id="estado" role="status">Cargando el maniquí…</p>
            </div>
        </div>
        <a id="volver" class="volver" href="/">Volver al catálogo</a>
    </header>
    <main class="escenario">
        <div class="escena">
            <div class="sexos" role="group" aria-label="Personaje">
                <button type="button" data-sexo="mujer" aria-pressed="true"><span class="simbolo" aria-hidden="true">♀</span>Mujer</button>
                <button type="button" data-sexo="hombre"><span class="simbolo" aria-hidden="true">♂</span>Hombre</button>
            </div>
            <canvas id="visor"></canvas>
            <div class="vista-barra">
                <button id="restablecer-vista" type="button" disabled>Restablecer vista</button>
            </div>
            <div class="controles" role="toolbar" aria-label="Animación">
                <div class="transporte">
                    <button id="play" type="button" disabled aria-pressed="false" aria-label="Reproducir">
                        <svg class="icono-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l10-5.5z"/></svg>
                        <svg class="icono-pausa" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4 2h3v12H4zm5 0h3v12H9z"/></svg>
                    </button>
                    <span class="tiempo"><span id="tiempo-actual">0:00</span> / <span id="tiempo-total">0:00</span></span>
                    <input id="progreso" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="Progreso">
                </div>
                <button id="velocidad" type="button" disabled aria-label="Velocidad 1×">1×</button>
            </div>
        </div>
        <div class="lateral">
            <aside class="musculos" aria-labelledby="musculos-titulo">
                <div class="musculos-cabecera">
                    <h2 id="musculos-titulo">Músculos trabajados</h2>
                    <button type="button" id="ver-musculos" class="ver-musculos" aria-expanded="false" aria-controls="musculos-panel" aria-haspopup="dialog">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.15v4.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="4.55" r="0.8" fill="currentColor"/></svg>
                        Ver músculos
                    </button>
                </div>
                <div class="musculos-vistas">
                    <figure>
                        <div class="recorte">
                            <img id="vista-frente" alt="Figura de frente" src="/musculos/mujer-frente.jpg">
                        </div>
                        <figcaption>Frente</figcaption>
                    </figure>
                    <figure>
                        <div class="recorte">
                            <img id="vista-espalda" alt="Figura de espalda" src="/musculos/mujer-espalda.jpg">
                        </div>
                        <figcaption>Espalda</figcaption>
                    </figure>
                </div>
            </aside>
            <section class="instrucciones" aria-labelledby="instrucciones-titulo">
                <h2 id="instrucciones-titulo">Instrucciones</h2>
                <ol id="instrucciones-lista"></ol>
                <p id="instrucciones-vacio" hidden>Este ejercicio todavía no tiene instrucciones.</p>
            </section>
        </div>
    </main>
    <div id="musculos-fondo" class="musculos-fondo" hidden></div>
    <div id="musculos-panel" class="musculos-panel" role="dialog" aria-modal="false" aria-labelledby="musculos-panel-titulo" hidden>
        <div class="musculos-panel-cabeza">
            <h3 id="musculos-panel-titulo">Músculos del ejercicio</h3>
            <button type="button" id="cerrar-musculos" class="musculos-cerrar" aria-label="Cerrar">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="musculos-modos">
            <button type="button" id="musculos-todos" aria-pressed="true">Mostrar todos</button>
            <button type="button" id="musculos-ninguno" aria-pressed="false">Sin resaltado</button>
        </div>
        <div class="musculos-modos">
            <button type="button" id="mirar-frente">Ver frente</button>
            <button type="button" id="mirar-espalda">Ver espalda</button>
        </div>
        <ul id="musculos-leyenda" class="musculos-leyenda"></ul>
        <p id="musculos-vacio" hidden>Este ejercicio no tiene músculos asociados.</p>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="/visor.js?v=idioma1"></script>
</body>
</html>
