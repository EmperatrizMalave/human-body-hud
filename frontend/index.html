<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hud-header">
        <div class="hud-brand">
            <p class="hud-kicker">Fitness OS</p>
            <h1>Cyber-HUD</h1>
        </div>
        <div id="lang-switch" class="lang-switch">
            <button type="button" id="btn-es" class="lang-btn is-active">ES</button>
            <button type="button" id="btn-en" class="lang-btn">EN</button>
        </div>
    </header>

    <main class="hud-grid">
        <aside class="hud-column">
            <h4 data-i18n="biocineticaTitle">BIOCINÉTICA</h4>
            <p class="hud-help" data-i18n="biocineticaDesc">Elige una zona muscular para filtrar el catálogo.</p>
            <div id="muscle-map" class="muscle-map"></div>
        </aside>

        <section class="hud-column hud-column--feed">
            <h4 data-i18n="catalogoTitle">CATÁLOGO DE EJERCICIOS</h4>
            <div class="search-container">
                <input
                    type="search"
                    id="hud-search-input"
                    class="search-input"
                    placeholder="// BUSCAR EJERCICIO, ZONA O EQUIPO..."
                    autocomplete="off"
                >
            </div>
            <p id="hud-status" class="hud-status" hidden></p>
            <div id="exercise-feed"></div>
            <div id="hud-pagination" class="hud-pagination"></div>
        </section>

        <aside class="hud-column">
            <h4 data-i18n="safeGreenTitle">MODO SAFE-GREEN</h4>
            <p class="hud-help" data-i18n="safeGreenDesc">Filtros de accesibilidad. Si marcas uno, solo ves esos ejercicios.</p>
            <label class="accessibility-label">
                <input type="checkbox" id="toggle-seated">
                <span data-i18n="chkSentada">Solo postura sentada</span>
            </label>
            <label class="accessibility-label">
                <input type="checkbox" id="toggle-impact">
                <span data-i18n="chkImpacto">Bajo impacto articular</span>
            </label>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
