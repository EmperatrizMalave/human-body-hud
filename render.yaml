services:
  - type: web
    name: human-body-hud
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python data/cargar_db.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
